<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Assessment - List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .controls-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        select, input {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }

        .cve-id {
            font-weight: 600;
            color: #667eea;
        }

        .score {
            font-weight: 600;
        }

        .score.high {
            color: #e74c3c;
        }

        .score.medium {
            color: #f39c12;
        }

        .score.low {
            color: #27ae60;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 12px;
            min-width: 40px;
        }

        .pagination .active {
            background: #667eea;
        }

        .pagination .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: #666;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #155724;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 CVE Assessment</h1>
            <p>Comprehensive CVE Database with Real-time Updates</p>
        </div>

        <div class="content">
            <div id="messageBox"></div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Total CVEs in Database</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Showing Page</div>
                    <div class="stat-value" id="currentPageDisplay">1</div>
                </div>
            </div>

            <div class="controls">
                <div class="controls-left">
                    <div class="control-group">
                        <label for="pageSize">Results Per Page:</label>
                        <select id="pageSize" onchange="resetAndLoad()">
                            <option value="10">10</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
                <div class="controls-right">
                    <button onclick="syncCves()">🔄 Sync CVEs from NVD</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="cveTable">
                    <thead>
                        <tr>
                            <th>CVE ID</th>
                            <th>Description</th>
                            <th>CVSS V3 Score</th>
                            <th>Last Modified</th>
                        </tr>
                    </thead>
                    <tbody id="cveTableBody">
                        <tr>
                            <td colspan="4" class="no-data">Loading CVEs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button onclick="previousPage()" id="prevBtn">← Previous</button>
                <span class="page-info">
                    Page <span id="pageNum">1</span> of <span id="totalPages">1</span>
                </span>
                <button onclick="nextPage()" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let pageSize = 10;

        function resetAndLoad() {
            currentPage = 0;
            loadCves();
        }

        function loadCves() {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerHTML = '';

            fetch(`/api/cves/list?page=${currentPage}&size=${pageSize}`)
                .then(response => response.json())
                .then(data => {
                    displayCves(data);
                    updateStats(data);
                    updatePagination(data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    messageBox.innerHTML = `<div class="error">Error loading CVEs: ${error.message}</div>`;
                    document.getElementById('cveTableBody').innerHTML = 
                        '<tr><td colspan="4" class="no-data">Failed to load CVEs</td></tr>';
                });
        }

        function displayCves(data) {
            const tbody = document.getElementById('cveTableBody');
            
            if (!data.cves || data.cves.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">No CVEs found</td></tr>';
                return;
            }

            tbody.innerHTML = data.cves.map(cve => `
                <tr onclick="viewDetail('${cve.cveId}')">
                    <td class="cve-id">${cve.cveId}</td>
                    <td>${truncate(cve.description, 80)}</td>
                    <td class="score ${getScoreClass(cve.cvssV3Score)}">${cve.cvssV3Score || 'N/A'}</td>
                    <td>${formatDate(cve.lastModifiedDate)}</td>
                </tr>
            `).join('');
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.totalRecords || 0;
            document.getElementById('currentPageDisplay').textContent = (data.currentPage || 0) + 1;
        }

        function updatePagination(data) {
            const totalPages = data.totalPages || 1;
            document.getElementById('pageNum').textContent = (currentPage + 1);
            document.getElementById('totalPages').textContent = totalPages;
            
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
        }

        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                loadCves();
                window.scrollTo(0, 0);
            }
        }

        function nextPage() {
            currentPage++;
            loadCves();
            window.scrollTo(0, 0);
        }

        function viewDetail(cveId) {
            window.location.href = `/view/cve/${cveId}`;
        }

        function syncCves() {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerHTML = '<div class="loading">Syncing CVEs from NVD API...</div>';
            
            fetch('/api/cves/sync-fresh?maxResults=100')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        messageBox.innerHTML = `<div class="success">✓ Sync successful! ${data.totalCvesInDb} CVEs stored in database</div>`;
                        resetAndLoad();
                    } else {
                        messageBox.innerHTML = `<div class="error">✗ Sync failed: ${data.message}</div>`;
                    }
                })
                .catch(error => {
                    messageBox.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
                });
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function truncate(str, length) {
            return str && str.length > length ? str.substring(0, length) + '...' : str;
        }

        function getScoreClass(score) {
            if (!score) return '';
            if (score >= 7) return 'high';
            if (score >= 4) return 'medium';
            return 'low';
        }

        // Load CVEs on page load
        document.addEventListener('DOMContentLoaded', loadCves);
    </script>
</body>
</html>
